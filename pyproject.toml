[project]
name = "bilderrahmen-collage"
version = "0.1.0"
description = "Find picture-frame collage layouts with uniform spacing and a sharp outer border; render them with LaTeX/TikZ."
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1",
]

[project.scripts]
collage = "collage.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["collage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
